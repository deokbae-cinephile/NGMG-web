name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Secrets가 모두 있으면 실서버용으로, 없으면 가상 데이터로 동작하는 데모로 빌드합니다.
      - name: Build
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ] && [ -n "$VITE_KAKAO_MAP_KEY" ]; then
            pnpm run build
          elif [ -n "$VITE_SUPABASE_URL$VITE_SUPABASE_ANON_KEY$VITE_KAKAO_MAP_KEY" ]; then
            echo "::error::Secrets 3개 중 일부만 있습니다. 모두 넣어 주세요."
            exit 1
          else
            echo "::notice::Secrets가 없어 데모로 배포합니다."
            pnpm run build:demo
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
