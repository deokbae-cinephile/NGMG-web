<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="낚시 포인트와 맛집을 지도에 남기고 출조 일정·준비물·기록·통계를 함께 챙기는 서비스" />
    <link rel="icon" href="%BASE_URL%favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- iOS 홈 화면에 추가했을 때 앱처럼 열리게 합니다. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="낚고먹고" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>낚고먹고</title>
  </head>
  <body>
    <!-- 자바스크립트를 받는 동안 보이는 첫 화면. 인트로의 검은 벽과 이어집니다. React가 그리면 사라집니다. -->
    <div id="root"><div id="boot" style="position: fixed; inset: 0; background: #0a0a0a"></div></div>
    <script>
      try {
        if (sessionStorage.getItem('ngmg:intro') || matchMedia('(prefers-reduced-motion: reduce)').matches)
          document.getElementById('boot').style.background = '#fafafa';
      } catch {
        document.getElementById('boot').style.background = '#fafafa';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
